name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Validate every brain
        run: |
          for dir in */; do
            brain="${dir%/}"
            if [ -d "$brain/.obsidian" ]; then
              scripts/validate-vault.sh "$brain"
            fi
          done

  autopilot-guard:
    # The rules are in .github/autopilot.json. Which pull requests it applies to is an input, not a
    # job-level `if:`: a required check that reports SKIPPED blocks the merge forever.
    if: github.event_name == 'pull_request'
    uses: promontory-studio/pedalion/.github/workflows/guard.yml@0185de09d9447da6d439a1f0823c1631a5c0eb25 # v1.0.0
    with:
      base-ref: ${{ github.base_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      authors: plover-autopilot[bot],pedalion[bot],dependabot[bot]
      pr-author: ${{ github.event.pull_request.user.login }}
      # No manifest here: the content is markdown, validated by a shell script.
      install: ""

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Bump patch version
        id: bump
        run: |
          IFS='.' read -r major minor patch < VERSION
          # Skip past any patch whose tag already exists, so a stale/orphaned
          # tag (e.g. left behind by a force-push race) can't wedge every
          # future release permanently.
          patch=$((patch + 1))
          while git rev-parse -q --verify "refs/tags/v$major.$minor.$patch" >/dev/null; do
            patch=$((patch + 1))
          done
          new_version="$major.$minor.$patch"
          echo "$new_version" > VERSION
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes

  notify-failure:
    needs: [test, release]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    permissions:
      issues: write
    uses: promontory-studio/pedalion/.github/workflows/notify-failure.yml@0185de09d9447da6d439a1f0823c1631a5c0eb25 # v1.0.0
    with:
      title: CI failed on main
      context: A push to main did not validate or release, so the published version no longer matches main.
      assignee: pablo-tech
